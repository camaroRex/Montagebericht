<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Montagebericht</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Montagebericht</h2>
    <form id="montageForm">
        
        <div class="form-row">
            <div class="form-group">
                <label for="monteurName">Name des Monteurs</label>
                <input type="text" id="monteurName" required placeholder="Vor- und Nachname">
            </div>
            <div class="form-group">
                <label for="personalNummer">Personalnummer</label>
                <input type="text" id="personalNummer" required placeholder="z.B. 12345">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="datum">Datum</label>
                <input type="date" id="datum" required>
            </div>
            <div class="form-group">
                <label for="ort">Einsatzort / Kunde</label>
                <input type="text" id="ort" required placeholder="Ort / Firmenname">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="uhrzeitAnkunft">Uhrzeit Ankunft</label>
                <input type="time" id="uhrzeitAnkunft" required>
            </div>
            <div class="form-group">
                <label for="uhrzeitAbreise">Uhrzeit Abreise</label>
                <input type="time" id="uhrzeitAbreise" required>
            </div>
        </div>

        <div class="form-group">
            <label>Abrechnungsart</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="pauschal"> Pauschal abgerechnet
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="hotel"> Über Hotel / Spesen
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="bemerkung">Arbeitsbeschreibung / Bemerkungen</label>
            <textarea id="bemerkung" placeholder="Durchgeführte Arbeiten, verwendete Materialien..."></textarea>
        </div>

        <button type="submit">Bericht absenden / Drucken</button>
    </form>
</div>

<script>
    // Heutiges Datum als Standard setzen
    document.getElementById('datum').valueAsDate = new Date();

    document.getElementById('montageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        window.print();
    });
</script>

</body>
</html>
